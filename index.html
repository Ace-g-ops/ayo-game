<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script async src="https://jam.pieter.com/2026/widget.js"></script>
    <title>Ayo Olopon - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        #game-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            width: 90%;
            max-width: 800px;
        }

        .turn-indicator {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .turn-indicator.player1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            font-weight: 900;
        }

        .turn-indicator.player2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #ffffff;
            font-weight: 900;
        }

        .score-board {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 25px;
            border-radius: 15px;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 20px;
        }

        .score-board .player {
            font-weight: bold;
        }

        .score-board .player.player1 {
            color: #667eea;
        }

        .score-board .player.player2 {
            color: #f5576c;
        }

        .restart-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .menu-btn {
            background: linear-gradient(135deg, #fc4a1a 0%, #f7b733 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 25px;
            border-radius: 10px;
            font-size: 13px;
            color: #333;
            z-index: 100;
            text-align: center;
            max-width: 90%;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.98);
            padding: 50px 70px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            z-index: 200;
            display: none;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        #game-over h2 {
            margin-bottom: 15px;
            color: #333;
            font-size: 2rem;
        }

        #game-over p {
            margin-bottom: 25px;
            color: #666;
            font-size: 1.2rem;
        }

        #game-over .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        #game-over button {
            padding: 15px 35px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }

        #game-over button:hover {
            transform: scale(1.05);
        }

        #game-over .play-again {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #game-over .back-menu {
            background: linear-gradient(135deg, #fc4a1a 0%, #f7b733 100%);
            color: white;
        }

        @media (max-width: 768px) {
            .hud {
                flex-direction: column;
                gap: 10px;
                top: 10px;
                padding: 10px;
            }

            .turn-indicator {
                font-size: 14px;
                padding: 10px 20px;
            }

            .score-board {
                font-size: 12px;
                padding: 10px 15px;
            }

            .restart-btn, .menu-btn {
                font-size: 12px;
                padding: 10px 20px;
            }

            .instructions {
                font-size: 11px;
                padding: 8px 15px;
                bottom: 10px;
            }

            #game-over {
                padding: 30px 40px;
                width: 90%;
            }

            #game-over h2 {
                font-size: 1.5rem;
            }

            #game-over p {
                font-size: 1rem;
            }

            #game-over button {
                padding: 12px 25px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <div class="hud">
        <div id="turn-indicator" class="turn-indicator player1">Player 1's Turn</div>
        <div class="score-board">
            <div class="player player1">Player 1: <span id="score1">0</span></div>
            <div class="player player2">Player 2: <span id="score2">0</span></div>
        </div>
        <button class="restart-btn" onclick="resetGame()">🔄 Restart</button>
        <button class="menu-btn" onclick="backToMenu()">🏠 Menu</button>
    </div>
    
    <div class="instructions">
        Click a pit on your side to distribute seeds counter-clockwise • Capture 2-3 seeds on opponent's side
    </div>
    
    <div id="game-over">
        <h2 id="winner-text">Game Over!</h2>
        <p id="final-score">Final Score: 0 - 0</p>
        <div class="buttons">
            <button class="play-again" onclick="resetGame()">Play Again</button>
            <button class="back-menu" onclick="backToMenu()">Main Menu</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
