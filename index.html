<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script async src="https://jam.pieter.com/2026/widget.js"></script>
    <title>Ayo Olopon - Traditional African Strategy Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .landing-content {
            text-align: center;
            color: white;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-title {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #667eea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(240, 147, 251, 0.3);
        }

        .game-subtitle {
            font-size: 1.5rem;
            color: #a0a0a0;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .game-preview {
            width: 300px;
            height: 200px;
            background: linear-gradient(135deg, #8B4513 0%, #654321 100%);
            border-radius: 20px;
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .game-preview::before {
            content: '🎮';
            font-size: 80px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .mode-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .play-button {
            padding: 18px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-decoration: none;
            display: inline-block;
        }

        .play-button.single-player {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .play-button.multi-player {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .play-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .play-button:active {
            transform: translateY(-2px) scale(1.02);
        }

        @media (max-width: 768px) {
            .game-title {
                font-size: 2.5rem;
            }

            .game-subtitle {
                font-size: 1.2rem;
            }

            .game-preview {
                width: 250px;
                height: 160px;
            }

            .play-button {
                padding: 15px 35px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="landing-content">
        <h1 class="game-title">Ayo Olopon</h1>
        <p class="game-subtitle">Traditional African Strategy Game</p>
        <div class="game-preview"></div>
        <div class="mode-buttons">
            <a href="game.html?mode=single" class="play-button single-player">
                🤖 Single Player
            </a>
            <a href="game.html?mode=multi" class="play-button multi-player">
                👥 Two Players
            </a>
        </div>
    </div>
</body>
</html>
