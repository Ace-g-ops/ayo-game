<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script async src="https://jam.pieter.com/2026/widget.js"></script>
    <title>Ayo Olopon - Traditional African Strategy Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .landing-content {
            text-align: center;
            color: white;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-title {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #667eea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(240, 147, 251, 0.3);
        }

        .game-subtitle {
            font-size: 1.5rem;
            color: #a0a0a0;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .device-notice {
            font-size: 0.9rem;
            color: #667eea;
            margin-bottom: 30px;
            font-weight: 400;
            background: rgba(102, 126, 234, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
        }

        .game-preview {
            width: 300px;
            height: 200px;
            background: linear-gradient(135deg, #8B4513 0%, #654321 100%);
            border-radius: 20px;
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .game-preview::before {
            content: '🎮';
            font-size: 80px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .avatar-section {
            margin-bottom: 30px;
        }

        .avatar-section h3 {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            justify-content: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .avatar-option {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a2a4a 0%, #1a1a3e 100%);
            border: 3px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .avatar-option:hover {
            transform: scale(1.1);
            border-color: #667eea;
        }

        .avatar-option.selected {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
            transform: scale(1.15);
        }

        .mode-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .play-button {
            padding: 18px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-decoration: none;
            display: inline-block;
        }

        .play-button.single-player {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .play-button.multi-player {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .play-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .play-button:active {
            transform: translateY(-2px) scale(1.02);
        }

        @media (max-width: 768px) {
            .game-title {
                font-size: 2.5rem;
            }

            .game-subtitle {
                font-size: 1.2rem;
            }

            .game-preview {
                width: 250px;
                height: 160px;
            }

            .avatar-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .avatar-option {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            .play-button {
                padding: 15px 35px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="landing-content">
        <h1 class="game-title">Ayo Olopon</h1>
        <p class="game-subtitle">Traditional African Strategy Game</p>
        <p class="device-notice">Best played on desktop</p>
        <div class="game-preview"></div>
        
        <div class="avatar-section">
            <h3>Choose Your Avatar</h3>
            <div class="avatar-grid" id="avatar-grid">
                <div class="avatar-option selected" data-avatar="🦁">🦁</div>
                <div class="avatar-option" data-avatar="🐘">🐘</div>
                <div class="avatar-option" data-avatar="🦅">🦅</div>
                <div class="avatar-option" data-avatar="🐯">🐯</div>
                <div class="avatar-option" data-avatar="🦒">🦒</div>
                <div class="avatar-option" data-avatar="🐆">🐆</div>
            </div>
        </div>
        
        <div class="mode-buttons">
            <a href="game.html?mode=single" class="play-button single-player" id="single-btn">
                🤖 Single Player
            </a>
            <a href="game.html?mode=multi" class="play-button multi-player" id="multi-btn">
                👥 Two Players
            </a>
        </div>
    </div>
    
    <script>
        // Avatar selection
        let selectedAvatar = localStorage.getItem('ayoAvatar') || '🦁';
        
        // Update UI with saved avatar
        document.querySelectorAll('.avatar-option').forEach(option => {
            if (option.dataset.avatar === selectedAvatar) {
                option.classList.add('selected');
            }
            option.addEventListener('click', () => {
                document.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
                selectedAvatar = option.dataset.avatar;
                localStorage.setItem('ayoAvatar', selectedAvatar);
            });
        });
        
        // Update button links with avatar
        function updateButtonLinks() {
            const singleBtn = document.getElementById('single-btn');
            const multiBtn = document.getElementById('multi-btn');
            singleBtn.href = `game.html?mode=single&avatar=${encodeURIComponent(selectedAvatar)}`;
            multiBtn.href = `game.html?mode=multi&avatar=${encodeURIComponent(selectedAvatar)}`;
        }
        
        updateButtonLinks();
        
        // Update links when avatar changes
        document.querySelectorAll('.avatar-option').forEach(option => {
            option.addEventListener('click', updateButtonLinks);
        });
    </script>
</body>
</html>
